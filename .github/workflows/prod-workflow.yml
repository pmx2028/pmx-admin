name: Deploy PROD

on:
  push:
    branches: [ "prod" ]   # 운영 브랜치 기준으로

concurrency:
  group: prod-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build (Gradle)
        run: ./gradlew clean build -x test

      - name: Prepare deploy bundle
        run: |
          mkdir -p ./deploy/scripts
          cp "$(ls -1 ./build/libs/*SNAPSHOT.jar | grep -v plain | head -n 1)" ./deploy/app.jar
          cp appspec-prod.yml ./deploy/appspec.yml
          cp -r ./scripts/prod/* ./deploy/scripts
          cd deploy
          zip -r deploy-prod.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Upload to S3
        run: |
          aws s3 cp deploy/deploy-prod.zip \
            s3://dealsite-github-action/paramount-pmx/prod/${{ github.sha }}.zip

      # 8) CodeDeploy 트리거 (현재는 주석 처리됨)
      #    - 이걸 켜면 업로드 후 즉시 배포까지 자동으로 진행됨
      - name: Trigger CodeDeploy
        run: |
          aws deploy create-deployment \
            --application-name "paramount-cms" \
            --deployment-group-name "prod-cms" \
            --s3-location bucket=dealsite-github-action,key=dealsite-cms/prod/${{ github.sha }}.zip,bundleType=zip