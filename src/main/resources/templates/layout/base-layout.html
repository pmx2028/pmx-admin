<th:block th:fragment="base-layout(pageContent, pageHead, pageModal, pageScript, title, subtitle)">
    <!DOCTYPE html>
    <html lang="kr"
          xmlns:th="http://www.thymeleaf.org"
          data-bs-theme="light" data-layout-mode="fluid"
          data-menu-color="dark" data-topbar-color="dark"
          data-layout-position="fixed" data-sidenav-size="default">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- <title th:if="${title != null and !#strings.isEmpty(title)}" th:text="${title + ' | DealSite CMS'}">DealSite CMS</title> -->
        <!-- <title th:unless="${title != null and !#strings.isEmpty(title)}">DealSite CMS</title> -->
        <title
            th:if="${title != null and !#strings.isEmpty(title)}"
            th:text="${
                (activeProfile == 'local' ? '[Local] ' :
                 activeProfile == 'dev'   ? '[Dev] '   : '')
                + title + ' | Paramount'
            }"
        >
            PMX
        </title>
        <title
            th:unless="${title != null and !#strings.isEmpty(title)}"
            th:text="${
                (activeProfile == 'local' ? '[Local] ' :
                 activeProfile == 'dev'   ? '[Dev] '   : '')
                + 'Paramount'
            }"
        >
            PMX
        </title>

        <meta content="A fully featured admin theme which can be used to build CRM, CMS, etc." name="description"/>
        <meta content="Coderthemes" name="author"/>

        <meta name="_csrf" th:content="${_csrf.token}" />
        <meta name="_csrf_header" th:content="${_csrf.headerName}" />

        <!-- ✅ 로그인 사용자 권한 전역 주입 -->
        <script th:inline="javascript">
            /*
             * 로그인 사용자의 권한을 JS 전역 변수로 설정
             * 비로그인 시 [] 빈 배열 반환
             */
            window.USER_AUTHORITIES =
                /*[[${#authentication != null
                      ? #authentication.authorities.![authority]
                      : T(java.util.Collections).emptyList()}]]*/ [];
        </script>

        <!-- ✅ 서버 설정값 전역 주입 (미리보기/링크 구성용) -->
        <script th:inline="javascript">
            window.APP_CONFIG = window.APP_CONFIG || {};
            window.APP_CONFIG.dUrl = /*[[${dUrl}]]*/ '';
            window.APP_CONFIG.dPlusUrl = /*[[${dPlusUrl}]]*/ '';
        </script>

        <!-- favicon -->
        <link rel="shortcut icon" href="/images/favicon.svg">

        <!-- Theme Config Js -->
        <script src="/js/config.js"></script>

        <!-- App css -->
        <link href="/css/app.css" rel="stylesheet" type="text/css" id="app-style" />
        <!-- Icons css -->
        <link href="/css/icons.min.css" rel="stylesheet" type="text/css" />
        <link href="/css/file-icons.css" rel="stylesheet" type="text/css" />

        <!-- custom css 전페이지 공통  -->
        <link href="/css/common.css" rel="stylesheet" type="text/css" />

        <!-- 추가적인 페이지별 head 요소 확장용 -->
        <th:block th:replace="${pageHead}"></th:block>

        <!-- ios 확대 제어  -->
        <link href="/css/ios-fix.css" rel="stylesheet" type="text/css" />
    </head>

    <body>
    <div th:class="'wrapper' + (${wrapperExtraClass} != null ? ' ' + ${wrapperExtraClass} : '')">
        <th:block th:replace="~{partials/topbar :: topbar_2ds}"></th:block>
        <th:block th:replace="~{partials/left-sidebar :: left-sidebar_2ds}"></th:block>

        <div class="content-page">
            <div class="content">
                <div th:class="'container-fluid' + (${containerFluidExtraClass} != null ? ' ' + ${containerFluidExtraClass} : '')">

                    <!-- 확장버튼-mobile 영역 -->
                    <th:block th:if="${mobileSearchExpandButton != null}">
                        <th:block th:replace="${mobileSearchExpandButton}"></th:block>
                    </th:block>

                    <!-- 에디터 페이지가 아니고, title이 있는 경우에만 page-title 영역 랜더링 -->
                    <th:block th:if="${title != null and !#strings.isEmpty(title)} and ${wrapperExtraClass == null and wrapperExtraClass!='editor'}">

                        <!-- subtitleLink가 없을 때 -->
                        <th:block th:if="${subtitleLink == null}">
                            <th:block th:replace="~{partials/page-title :: page-title(subtitle=${subtitle}, title=${title}, subtitleLink='')}"></th:block>
                        </th:block>

                        <!-- subtitleLink가 있을 때 -->
                        <th:block th:if="${subtitleLink != null}">
                            <th:block th:replace="~{partials/page-title :: page-title(subtitle=${subtitle}, title=${title}, subtitleLink=${subtitleLink})}"></th:block>
                        </th:block>

                    </th:block>

                    <!-- 개별 페이지 본문 삽입 자리 -->
                    <th:block th:replace="${pageContent}"></th:block>
                </div>
            </div>

            <th:block th:replace="~{partials/footer :: footer}"></th:block>
        </div>

        <!-- 페이지별 모달 삽입 자리 -->
        <th:block th:replace="${pageModal}"></th:block>

    </div> <!-- wrapper -->

    <!-- 기사 미리보기 인쇄시 사용되는 영역 (css 충돌로 인해 해당 자리에 배치) -->
    <div id="printOnly" style="display:none;">
        <div id="printContent">
        </div>
    </div>

    <!-- JS -->
    <!-- Vendor js -->
    <script src="/js/vendor.min.js"></script>

    <!-- App js -->
    <script src="/js/app.js"></script>
    <script src="/js/common/mobile-breakpoint-alert.js"></script>

    <!--- Datatables js --->
    <script src="/vendor/datatables.net/js/jquery.dataTables.min.js"></script>
    <script src="/vendor/datatables.net-bs5/js/dataTables.bootstrap5.min.js"></script>
    <script src="/vendor/datatables.net-responsive/js/dataTables.responsive.min.js"></script>
    <script src="/vendor/datatables.net-responsive-bs5/js/responsive.bootstrap5.min.js"></script>

    <!-- Custom js -->
    <script src="/js/common/common.js"></script>
    <script src="/js/core/http-interceptor.js"></script>

    <!-- 페이지별 추가 script 삽입 -->
    <th:block th:replace="${pageScript}"></th:block>

    </body>
    </html>
</th:block>
