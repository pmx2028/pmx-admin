<!--
  페이지 생성시 해당 페이지 구조 복붙해서 사용하면됩니다.
-->
<!DOCTYPE html>
<th:block th:replace="~{layout/base-layout :: base-layout(
            pageContent=~{::pageContent},
            pageHead=~{::pageHead},
            pageModal=~{::pageModal},
            pageScript=~{::pageScript},
            title='월별강습관리',
            subtitle='관리'
        )}">

    <!-- head block -->
    <th:block th:fragment="pageHead">
        <!-- 여기에 추가적으로 필요한 head 내용을 넣습니다. -->
        <!-- Daterangepicker css -->
        <link href="/vendor/daterangepicker/daterangepicker.css" rel="stylesheet" type="text/css" />
        <!-- Datatables css -->
        <link href="/vendor/datatables.net-bs5/css/dataTables.bootstrap5.min.css" rel="stylesheet" type="text/css" />
        <link href="/vendor/datatables.net-responsive-bs5/css/responsive.bootstrap5.min.css" rel="stylesheet" type="text/css" />

        <!-- custom css  -->
        <link href="/css/management.css" rel="stylesheet" type="text/css" />
    </th:block>

    <!-- content block -->
    <th:block th:fragment="pageContent">
        <th:block th:replace="~{partials/mobile-not-supported-notice :: mobile-not-supported-notice('lesson-mobile-notice')}"></th:block>
        <!-- 여기에 페이지 본문 내용을 넣습니다. -->
        <!-- row -->
        <div class="row management-mobile-notice-target">
            <!-- col-->
            <div class="col-12 mobile-p0 m-0">
                <!-- card -->
                <div class="card">
                    <!-- card body-->
                    <div class="card-body p-2">
                        <form>
                            <!-- top -->
                            <div class="manage-data manage-bottom">
                                <div class="row g-2 justify-content-end">
                                    <!-- 등록 버튼 -->
                                    <div class="col-12 col-md-auto me-md-auto">
                                        <button type="button" class="btn btn-primary d-none" id="btn-confirmed-status">
                                            등록
                                        </button>
                                    </div>
                                    <!-- 연도 -->
                                    <div class="col-6 col-md-4 col-lg-auto">
                                        <div class="d-flex align-items-center gap-2">
                                            <h5 class="mb-0 text-nowrap">연도</h5>
                                            <input type="number"
                                                   class="form-control"
                                                   id="search-year"
                                                   min="2000"
                                                   max="2100">
                                        </div>
                                    </div>
                                    <!-- 월 -->
                                    <div class="col-6 col-md-4 col-lg-auto">
                                        <div class="d-flex align-items-center gap-2">
                                            <h5 class="mb-0 text-nowrap">월</h5>
                                            <select class="form-select" id="search-month">
                                            </select>
                                        </div>
                                    </div>

                                    <!-- 지역/시군구/아파트 검색영역 (공통 fragment) -->
                                    <th:block th:replace="~{partials/search-apart-filters :: search-apart-filters}"></th:block>
                                    <!-- 검색 -->
                                    <div class="col-12 col-lg-auto">
                                        <div class="input-group">
                                            <input type="text"
                                                   id="target-text"
                                                   class="form-control me-1"
                                                   placeholder="아파트 검색">
                                            <button type="button"
                                                    class="btn btn-primary"
                                                    id="btn-search">
                                                <i class="ri-search-line me-1"></i>
                                                검색
                                            </button>

                                            <button type="button"
                                                    class="btn btn-soft-dark ms-1"
                                                    id="btn-reset">
                                                <i class="ri-loop-left-fill me-1"></i>
                                                초기화
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div><!--//top -->

                            <ul class="nav nav-tabs mb-2" id="lesson-tabs" role="tablist">
                                <li class="nav-item" role="presentation">
                                    <button type="button" class="nav-link active" data-lesson-tab="gxtuni">
                                        GX/트니트니
                                    </button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button type="button" class="nav-link" data-lesson-tab="health">
                                        헬스
                                    </button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button type="button" class="nav-link" data-lesson-tab="golf">
                                        골프
                                    </button>
                                </li>
                            </ul>
                            <div class="d-flex justify-content-end mb-2">
                                <button type="button" class="btn btn-primary" id="btn-bulk-save">
                                    <i class="ri-save-line me-1"></i> 일괄 저장
                                </button>
                            </div>
                            <!-- table #dataTable - DataTable 로드 -->
                            <div class="scrollable-container" data-simplebar data-simplebar-auto-hide="false">
                                <div class="table-inner-wrapper">
                                    <table id="lessonDataTable" class="table table-striped table-hover w-100 custom org-custom text-center">
                                    </table>
                                </div>
                            </div><!--//table -->
                        </form>
                    </div><!--// card body-->
                </div> <!--// card -->
            </div><!--//col-->


        </div><!--//row -->
    </th:block>

    <!-- modal block -->
    <th:block th:fragment="pageModal">

        <!-- 주문정보 확인 모달 -->
        <div class="modal fade" id="order-confirm-modal" tabindex="-1" aria-labelledby="order-confirm-modal" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header justify-content-end bg-primary text-white">
                        <h5 class="modal-title">
                            <i class="ri-file-list-3-fill me-1"></i>
                            주문정보 확인
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <div class="modal-body px-2 pb-3">
                        <div class="row mb-2">
                            <div class="col-4 text-muted">주문번호</div>
                            <div class="col-8" id="order-confirm-no">-</div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-4 text-muted">주문명</div>
                            <div class="col-8" id="order-confirm-name">-</div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-4 text-muted">주문금액</div>
                            <div class="col-8" id="order-confirm-amount">-</div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-4 text-muted">할인금액</div>
                            <div class="col-8" id="order-confirm-discount">-</div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-4 text-muted">최종 결제금액</div>
                            <div class="col-8 fw-bold text-primary fs-5" id="order-confirm-payment-amount">-</div>
                        </div>
                    </div>

                    <div class="modal-footer p-2">
                        <button type="button" class="btn btn-light me-1" data-bs-dismiss="modal">취소</button>
                        <button type="button" class="btn btn-primary" id="btn-order-confirm-card">
                            <i class="ri-bank-card-line me-1"></i> 카드결제
                        </button>
                        <button type="button" class="btn btn-success" id="btn-order-confirm-vbank">
                            <i class="ri-bank-line me-1"></i> 가상계좌결제
                        </button>
                    </div>
                </div>
            </div>
        </div><!--// 주문정보 확인 모달 -->

    </th:block>

    <!-- script block -->
    <th:block th:fragment="pageScript">

        <!-- Daterangepicker Plugin js / 날짜 범위 선택 -->
        <script src="/vendor/daterangepicker/moment.min.js"></script>
        <script src="/vendor/daterangepicker/daterangepicker.js"></script>
        <!-- custom -->
        <script type="module" src="/js/lesson/lesson.js"></script>

    </th:block>

</th:block>
