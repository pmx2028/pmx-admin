<!--
  페이지 생성시 해당 페이지 구조 복붙해서 사용하면됩니다.
-->
<!DOCTYPE html>
<th:block th:replace="~{layout/base-layout :: base-layout(
            pageContent=~{::pageContent},
            pageHead=~{::pageHead},
            pageModal=~{::pageModal},
            pageScript=~{::pageScript},
            title='아파트강습현황',
            subtitle='관리'
        )}">

    <!-- head block -->
    <th:block th:fragment="pageHead">
        <!-- 여기에 추가적으로 필요한 head 내용을 넣습니다. -->
        <!-- Daterangepicker css -->
        <link href="/vendor/daterangepicker/daterangepicker.css" rel="stylesheet" type="text/css" />
        <!-- Datatables css -->
        <link href="/vendor/datatables.net-bs5/css/dataTables.bootstrap5.min.css" rel="stylesheet" type="text/css" />
        <link href="/vendor/datatables.net-responsive-bs5/css/responsive.bootstrap5.min.css" rel="stylesheet" type="text/css" />

        <!-- custom css  -->
        <link href="/css/management.css" rel="stylesheet" type="text/css" />
        <link href="/css/gird24-system.css" rel="stylesheet" type="text/css" />
    </th:block>

    <!-- content block -->
    <th:block th:fragment="pageContent">
        <!-- 여기에 페이지 본문 내용을 넣습니다. -->
        <!-- row -->
        <div class="row">

            <!-- col-->
            <div class="col-12 mobile-p0 m-0">
                <!-- card -->
                <div class="card">
                    <!-- card body-->
                    <div class="card-body p-2">
                        <form>
                            <!-- top -->
                            <div class="manage-data manage-bottom">
                                <div class="grid-24">
                                    <div class="row">
                                        <!-- 검색영역 -->
                                        <div class="col-sm-19 col-lg-20 col-xl-21">
                                            <div class="grid-24">
                                                <div class="row justify-content-end">
                                                    <div class="col-sm-5 col-md-4 col-lg-3 col-xl-2 mb-2 selectbox-pe-0">
                                                        <div class="input-group d-flex align-items-center">
                                                            <h5 class="mb-0 me-2">연도</h5>
                                                            <input type="number" class="form-control" id="search-year" min="2000" max="2100">
                                                        </div>
                                                    </div>
                                                    <div class="col-sm-5 col-md-4 col-lg-3 col-xl-2 mb-2 selectbox-pe-0">
                                                        <div class="input-group d-flex align-items-center">
                                                            <h5 class="mb-0 me-2">월</h5>
                                                            <select class="form-select" id="search-month" aria-label="월">
                                                            </select>
                                                        </div>
                                                    </div>
                                                    <div class="col-sm-7 col-md-6 col-lg-4 col-xl-3 mb-2 selectbox-pe-0">
                                                        <div class="input-group d-flex align-items-center">
                                                            <h5 class="mb-0 me-2">확정여부</h5>
                                                            <select class="form-select" id="search-target-confirmed" aria-label="확정상태">
                                                                <option value="-">전체</option>
                                                                <option value="">미등록</option>
                                                                <option value="0">등록</option>
                                                                <option value="1">확정</option>
                                                            </select>
                                                        </div>
                                                    </div>
                                                    <!--// 지역영역 ---->
                                                    <div class="col-sm-7 col-md-6 col-lg-4 col-xl-3 mb-2 selectbox-pe-0">
                                                        <div class="input-group d-flex align-items-center">
                                                            <h5 class="mb-0 me-2">지역</h5>
                                                            <select class="form-select" id="search-target-depth1" aria-label="">
                                                            </select>
                                                        </div>
                                                    </div><!--// 지역영역 -->
                                                    <!-- 시군영역 -->
                                                    <div class="col-sm-7 col-md-6 col-lg-4 col-xl-3 mb-2 selectbox-pe-0">
                                                        <div class="input-group d-flex align-items-center">
                                                            <h5 class="mb-0 me-2">시군구</h5>
                                                            <select class="form-select" id="search-target-depth2" aria-label="">
                                                            </select>
                                                        </div>
                                                    </div>
                                                    <div class="col-sm-7 col-md-6 col-lg-4 col-xl-4 mb-2 selectbox-pe-0">
                                                        <div class="input-group d-flex align-items-center">
                                                            <h5 class="mb-0 me-2">아파트</h5>
                                                            <select class="form-select" id="search-target-apart" aria-label="">
                                                            </select>
                                                        </div>
                                                    </div><!--// 시군영역 -->
                                                    <!-- 검색 -->
                                                    <div class="col-sm-17 col-md-17 col-lg-14 col-xl-8 col-xxxl-8 mb-2">
                                                        <div class="input-group">
                                                            <input type="text" id="target-text" class="form-control w-33"
                                                                   placeholder="아파트 검색">
                                                            <button type="button" class="btn btn-primary border-primary" id="btn-search">
                                                                <i class="ri-search-line me-1"></i> 검색
                                                            </button>
                                                            <button type="button" class="btn btn-soft-dark shadow-none ms-1" id="btn-reset">
                                                                <i class="ri-loop-left-fill me-1"></i> <span>초기화</span>
                                                            </button>
                                                        </div>
                                                    </div><!--// 검색 -->
                                                </div><!--//row -->
                                            </div>
                                        </div><!--// 검색영역 -->

                                    </div><!--//row -->
                                </div>
                            </div><!--//top -->

                            <!-- table #dataTable - DataTable 로드 -->
                            <div class="scrollable-container" data-simplebar data-simplebar-auto-hide="false">
                                <div class="table-inner-wrapper">
                                    <table id="apartConfirmedDataTable" class="table table-striped table-hover w-100 custom org-custom text-center">
                                    </table>
                                </div>
                            </div><!--//table -->
                            <!-- 푸터 페이지네이션 -->
                            <div class="dt-footer" data-table="apartConfirmedDataTable"></div>
                        </form>
                    </div><!--// card body-->
                </div> <!--// card -->
            </div><!--//col-->


        </div><!--//row -->
    </th:block>

    <!-- modal block -->
    <th:block th:fragment="pageModal">


    </th:block>

    <!-- script block -->
    <th:block th:fragment="pageScript">

        <!-- Daterangepicker Plugin js / 날짜 범위 선택 -->
        <script src="/vendor/daterangepicker/moment.min.js"></script>
        <script src="/vendor/daterangepicker/daterangepicker.js"></script>

        <!-- custom -->
        <script type="module" src="/js/lesson/confirmed.js"></script>

    </th:block>

</th:block>
