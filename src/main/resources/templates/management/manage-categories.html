<!--
  페이지 생성시 해당 페이지 구조 복붙해서 사용하면됩니다.
-->
<!DOCTYPE html>
<th:block
        th:replace="~{layout/base-layout :: base-layout(
            pageContent=~{::pageContent},
            pageHead=~{::pageHead},
            pageModal=~{::pageModal},
            pageScript=~{::pageScript},
            title='강습분류관리',
            subtitle='관리'
        )}">

    <!-- head block -->
    <th:block th:fragment="pageHead">
        <!-- 여기에 추가적으로 필요한 head 내용을 넣습니다. -->

        <link href="/vendor/datatables.net-bs5/css/dataTables.bootstrap5.min.css" rel="stylesheet" type="text/css" />
        <link href="/vendor/datatables.net-responsive-bs5/css/responsive.bootstrap5.min.css" rel="stylesheet" />

        <!-- custom css  -->
        <link href="/css/management.css" rel="stylesheet" type="text/css" />
    </th:block>

    <!-- content block -->
    <th:block th:fragment="pageContent">
        <!-- 여기에 페이지 본문 내용을 넣습니다. -->
        <th:block th:replace="~{partials/mobile-not-supported-notice :: mobile-not-supported-notice('manage-own-categories-mobile-notice')}"></th:block>
        <!-- row -->
        <div class="row management-mobile-notice-target" id="manage-own-categories-content">
            <!-- col-->
            <div class="col-12 mobile-p0">
                <!-- card -->
                <div class="card">
                    <!-- card body-->
                    <div class="card-body p-2">
                        <form>
                            <!-- tab-content -->
                            <div class="tab-content">
                                <div class="row g-2">
                                    <div class="col-lg-3">
                                        <div class="d-flex align-items-center justify-content-between gap-1 mb-2" style="min-height: 38px;">
                                            <h5 class="mb-0">분류명</h5>
                                            <div class="d-flex flex-wrap justify-content-end gap-2">
                                                <!--
                                                <button
                                                        id="CreateBtn"
                                                        type="button"
                                                        class="btn btn-outline-primary"
                                                        data-bs-toggle="modal"
                                                        data-bs-target="#category-modal">
                                                    <i class="ri-add-line me-1"></i>
                                                    <span>분류추가</span>
                                                </button>

                                                <button
                                                        id="ReorderBtn"
                                                        type="button"
                                                        class="btn btn-outline-secondary">
                                                    <i class="ri-drag-move-2-line me-1"></i>
                                                    <span>순서변경</span>
                                                </button>

                                                <button
                                                        id="CancelOrderBtn"
                                                        type="button"
                                                        class="btn btn-secondary d-none">
                                                    <i class="ri-close-line me-1"></i>
                                                    <span>취소</span>
                                                </button>

                                                <button
                                                        id="SaveOrderBtn"
                                                        type="button"
                                                        class="btn btn-outline-primary d-none">
                                                    <i class="ri-save-3-line me-1"></i>
                                                    <span>순서저장</span>
                                                </button>
                                                -->
                                            </div>
                                        </div>
                                        <!-- 공통 테이블: 선택된 탭(최상위 카테고리)의 하위 트리만 이 안에 그림 -->
                                        <div class="table-responsive">
                                            <table id="categoryTable" class="table table-hover w-100 custom own-custom">
                                                <!-- thead -->
                                                <thead>
                                                <tr>
                                                    <th style="width:5%;">#</th>
                                                    <th class="text-start">분류명</th>
                                                    <th style="width:10%;">사용여부</th>
                                                    <!--th style="width:20%;">작업</th-->
                                                </tr>
                                                </thead><!--//thead -->
                                                <!-- tbody -->
                                                <tbody id="categoryTableBody" data-plugin="dragula">
                                                </tbody>
                                            </table>
                                        </div>
                                        <!-- // 공통 테이블 -->
                                    </div>

                                    <div class="col-lg-9">
                                        <div class="mb-2" style="min-height: 38px;"></div>
                                        <div class="row mb-2">
                                            <div class="col-2 my-1">
                                                <h5 class="mb-0" id="detailPanelTitle">상세설명</h5>
                                            </div>
                                            <div class="col-10 my-1">
                                                <small class="text-muted" id="detailPanelHint">좌측 2depth 카테고리를 선택해 주세요.</small>
                                            </div>
                                        </div>

                                        <div id="categoryDetailEmpty" class="border rounded p-3 text-muted">
                                            2depth 카테고리를 선택하면 상세설명 항목을 추가할 수 있습니다.
                                        </div>

                                        <div id="categoryDetailEditor" class="d-none">
                                            <div class="row mb-2">
                                                <div class="col-2 my-1">금액(원)</div>
                                                <div class="col-10">
                                                    <input id="detailPrice" type="number" min="0" class="form-control" placeholder="금액을 입력해 주세요">
                                                </div>
                                            </div>
                                            <div class="row mb-2">
                                                <div class="col-2 my-1">카테고리설명</div>
                                                <div class="col-10">
                                                    <textarea id="detailDescription" class="form-control resize-none" rows="3" placeholder="카테고리설명을 입력해 주세요"></textarea>
                                                </div>
                                            </div>
                                            <div class="row mb-2">
                                                <div class="col-2 my-1">이용방법</div>
                                                <div class="col-10">
                                                    <textarea id="detailUsageInfo" class="form-control resize-none" rows="3" placeholder="이용방법을 입력해 주세요"></textarea>
                                                </div>
                                            </div>
                                            <div class="row">
                                                <div class="col-2 ">사진등록/교체</div>
                                                <div class="col-10">
                                                    <!-- 사진 등록 -->
                                                    <div class="input-group">
                                                        <input class="form-control" type="file" id="formFile">
                                                        <button class="btn btn-outline-danger" type="button" id="deleteFileBtn" style="display: none;">삭제</button>
                                                    </div>
                                                    <!--// 사진 등록 -->
                                                    <!-- 미리보기 이미지 -->
                                                    <div class="d-flex justify-content-center">
                                                        <img id="previewImage" src="" alt="미리보기" class="img-fluid rounded border  d-none mt-2" style="max-height: 448px; object-fit: cover;">
                                                        <div id="uploadLoading" class="d-none mt-3">
                                                            <div class="spinner-border spinner-border-sm me-1"></div>업로드 중입니다...
                                                        </div>
                                                    </div>
                                                    <!-- 파일명 -->
                                                    <div id="fileNameDisplay" class="text-muted mt-1"></div>
                                                </div>
                                            </div>
                                            <div class="row">
                                                <div class="col-2 ">사진등록/교체</div>
                                                <div class="col-10">
                                                    <!-- 사진 등록 -->
                                                    <div class="input-group">
                                                        <input class="form-control" type="file" id="formFile1">
                                                        <button class="btn btn-outline-danger" type="button" id="deleteFileBtn1" style="display: none;">삭제</button>
                                                    </div>
                                                    <!--// 사진 등록 -->
                                                    <!-- 미리보기 이미지 -->
                                                    <div class="d-flex justify-content-center">
                                                        <img id="previewImage1" src="" alt="미리보기" class="img-fluid rounded border  d-none mt-2" style="max-height: 448px; object-fit: cover;">
                                                        <div id="uploadLoading1" class="d-none mt-3">
                                                            <div class="spinner-border spinner-border-sm me-1"></div>업로드 중입니다...
                                                        </div>
                                                    </div>
                                                    <!-- 파일명 -->
                                                    <div id="fileNameDisplay1" class="text-muted mt-1"></div>
                                                </div>
                                            </div>
                                            <div class="d-flex justify-content-end gap-1 mb-3">
                                                <button type="button" id="SaveDetailBtn" class="btn btn-primary">
                                                    <i class="ri-check-line me-1"></i>저장
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div><!--//tab-content -->
                        </form>
                    </div><!--//card body-->
                </div> <!--//card -->
            </div><!--//col-->
        </div><!--//row -->
    </th:block>

    <!-- modal block -->
    <th:block th:fragment="pageModal">
        <!-- 분류추가/수정 공통 모달 -->
        <div class="modal fade" id="category-modal" tabindex="-1" aria-labelledby="category-modal" aria-hidden="true">
            <div class="modal-dialog" >
                <div class="modal-content">
                    <!-- modal-header -->
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title"><i class="ri-file-add-line me-1"></i> 분류추가</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <!--// modal-header -->

                    <!-- modal-body -->
                    <div class="p-1">
                        <div id="dynamic-modal-body" class="modal-body px-2 pb-3">
                            <div id="parentCategoryRow" class="row mb-2">
                                <div class="col-3 my-1">상위분류명</div>
                                <div class="col-9">
                                    <input id="modalParentCategory" class="form-control resize-none" placeholder="상위분류" readonly>
                                </div>
                            </div>
                            <!---->
                            <div class="row mb-2">
                                <div class="col-3 my-1">분류명</div>
                                <div class="col-9">
                                    <input id="modalCategoryName" class="form-control resize-none" placeholder="분류명을 입력해 주세요">
                                </div>
                            </div>
                            <!---->
                            <div class="row">
                                <div class="col-3 my-1">사용여부</div>
                                <div class="col-9">
                                    <div class="input-group">
                                        <select class="form-select" id="modalUsageSelect" aria-label="">
                                            <option value="1" selected="">사용</option>
                                            <option value="0">미사용</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <!---->                            
                        </div>
                    </div>
                    <!--// modal-body -->

                    <!-- modal-footer -->
                    <div class="modal-footer p-2">
                        <button type="button" class="btn btn-light me-1" data-bs-dismiss="modal">취소</button>
                        <button type="button" id="confirmAddCategory" class="btn btn-primary me-1 btn-save"><i class="ri-check-line me-1"></i>분류추가</button>
                    </div>
                    <!--// modal-footer -->
                </div>
            </div>
        </div><!--// 분류추가/수정 공통 모달-->
    </th:block>

    <!-- script block -->
    <th:block th:fragment="pageScript">

        <!-- dragula js-->
        <script src="/vendor/dragula/dragula.min.js"></script>  

        <script type="module" src="/js/management/manage-category.js"></script>

    </th:block>

</th:block>
