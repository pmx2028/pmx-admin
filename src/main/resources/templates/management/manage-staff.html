<!--
  페이지 생성시 해당 페이지 구조 복붙해서 사용하면됩니다.
-->
<!DOCTYPE html>
<th:block th:replace="~{layout/base-layout :: base-layout(
            pageContent=~{::pageContent},
            pageHead=~{::pageHead},
            pageModal=~{::pageModal},
            pageScript=~{::pageScript},
            title='직원관리',
            subtitle='관리'
        )}">

    <!-- head block -->
    <th:block th:fragment="pageHead">
        <!-- 여기에 추가적으로 필요한 head 내용을 넣습니다. -->
        <!-- Daterangepicker css -->
        <link href="/vendor/daterangepicker/daterangepicker.css" rel="stylesheet" type="text/css" />
        <!-- Datatables css -->
        <link href="/vendor/datatables.net-bs5/css/dataTables.bootstrap5.min.css" rel="stylesheet" type="text/css" />
        <link href="/vendor/datatables.net-responsive-bs5/css/responsive.bootstrap5.min.css" rel="stylesheet" type="text/css" />

        <!-- custom css  -->
        <link href="/css/management.css" rel="stylesheet" type="text/css" />
    </th:block>

    <!-- content block -->
    <th:block th:fragment="pageContent">
        <th:block th:replace="~{partials/mobile-not-supported-notice :: mobile-not-supported-notice('manage-staff-mobile-notice')}"></th:block>
        <!-- 여기에 페이지 본문 내용을 넣습니다. -->
        <!-- row -->
        <div class="row management-mobile-notice-target">

            <!-- col-->
            <div class="col-12 mobile-p0 m-0">
                <!-- card -->
                <div class="card">
                    <!-- card body-->
                    <div class="card-body p-2">
                        <form>
                            <!-- top -->
                            <div class="manage-data manage-bottom">
                                <div class="row g-2">
                                    <!-- 버튼 -->
                                    <div class="col-12 col-md-auto">
                                        <button type="button" class="btn btn-primary management-btn mb-2" data-bs-toggle="modal" data-bs-target="#user-modal">
                                            <i class="ri-add-circle-line me-1"></i> 직원추가
                                        </button>
                                    </div><!--//버튼 -->

                                    <!-- 검색영역 -->
                                    <div class="col-12 col-md">
                                        <div class="row g-2 justify-content-md-end">
                                            <!-- Role영역 -->
                                            <div class="col-6 col-sm-4 col-lg-3 col-xl-2 mb-2 selectbox-pe-0">
                                                <div class="input-group d-flex align-items-center">
                                                    <h5 class="mb-0 me-2">직책</h5>
                                                    <select class="form-select" id="search-target" aria-label="">
                                                    </select>
                                                </div>
                                            </div><!--// Role영역 -->

                                            <!-- 검색 -->
                                            <div class="col-12 col-sm-8 col-lg-6 col-xl-4 mb-2">
                                                <div class="input-group">
                                                    <input type="text" id="target-text" class="form-control w-33"
                                                           placeholder="이름 검색">
                                                    <button type="button" class="btn btn-primary border-primary" id="btn-search">
                                                        <i class="ri-search-line me-1"></i> 검색
                                                    </button>
                                                    <button type="button" class="btn btn-soft-dark shadow-none ms-1" id="btn-reset">
                                                        <i class="ri-loop-left-fill me-1"></i> <span>초기화</span>
                                                    </button>
                                                </div>
                                            </div><!--// 검색 -->
                                        </div><!--//row -->
                                    </div><!--// 검색영역 -->
                                </div><!--//row -->
                            </div><!--//top -->

                            <!-- table #dataTable - DataTable 로드 -->
                            <div class="scrollable-container" data-simplebar data-simplebar-auto-hide="false">
                                <div class="table-inner-wrapper">
                                    <table id="staffDataTable" class="table table-striped table-hover w-100 custom org-custom text-center">
                                    </table>
                                </div>
                            </div><!--//table -->
                            <!-- 푸터 페이지네이션 -->
                            <div class="dt-footer" data-table="staffDataTable"></div>
                        </form>
                    </div><!--// card body-->
                </div> <!--// card -->
            </div><!--//col-->


        </div><!--//row -->
    </th:block>

    <!-- modal block -->
    <th:block th:fragment="pageModal">

        <!-- 사용자추가 모달 -->
        <div class="modal fade" id="user-modal" tabindex="-1" aria-labelledby="user-modal" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <!-- modal-header -->
                    <div class="modal-header justify-content-end bg-primary text-white">
                        <h5 class="modal-title">
                            <i class="ri-user-add-fill me-1"></i>
                            <span id="user-modal-title">새 계정 생성</span>
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <!--// modal-header -->

                    <!-- modal-body -->
                    <div class="p-1">
                        <div class="modal-body px-2 pb-3">
                            <!---->
                            <div class="row mb-2">
                                <div class="col-3 ">아이디</div>
                                <div class="col-9">
                                    <input type="text" class="form-control" id="login" placeholder="아이디를 입력해 주세요">
                                </div>
                            </div>
                            <!---->
                            <div class="row mb-2">
                                <div class="col-3 ">비밀번호</div>
                                <div class="col-9">
                                    <input type="password" class="form-control" id="password" placeholder="비밀번호를 입력해 주세요">
                                </div>
                            </div>
                            <!---->
                            <div class="row mb-2">
                                <div class="col-3 ">비밀번호 확인</div>
                                <div class="col-9">
                                    <input type="password" class="form-control" id="pw-check" placeholder="비밀번호를 다시 입력해 주세요">
                                </div>
                            </div>
                            <!---->
                            <div class="row">
                                <div class="col-3 ">이름</div>
                                <div class="col-9">
                                    <input type="text" class="form-control mb-2" id="name" placeholder="이름을 입력해 주세요">
                                </div>
                            </div>
                            <!---->
                            <div class="row mb-2">
                                <div class="col-3 ">role영역</div>
                                <div class="col-9">
                                    <select class="form-select" id="role" aria-label="">
                                    </select>
                                </div>
                            </div>
                            <!---->
                            <div class="row">
                                <div class="col-3 ">이메일</div>
                                <div class="col-9">
                                    <input type="text" class="form-control mb-2" id="email" placeholder="이메일을 입력해 주세요">
                                </div>
                            </div>
                            <!---->
                            <div class="row">
                                <div class="col-3 ">휴대폰</div>
                                <div class="col-9">
                                    <input type="text" class="form-control mb-2" id="mobile" placeholder="휴대폰 번호를 입력해 주세요">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-3 ">우편번호</div>
                                <div class="col-9">
                                    <input type="text" class="form-control mb-2" id="zipcode" placeholder="우편번호를 입력해 주세요">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-3 ">주소</div>
                                <div class="col-9">
                                    <input type="text" class="form-control mb-2" id="address" placeholder="주소를 입력해 주세요">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-3 ">성별</div>
                                <div class="col-9 mb-2">
                                    <div class="d-flex align-items-center gap-3">
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="sex" id="sex-male" value="M">
                                            <label class="form-check-label" for="sex-male">남성</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="sex" id="sex-female" value="F">
                                            <label class="form-check-label" for="sex-female">여성</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-3 ">생년월인</div>
                                <div class="col-9">
                                    <input type="text" class="form-control mb-2" id="birthday" placeholder="생년월인를 입력해 주세요">
                                </div>
                            </div>
                            <!---->
                            <div class="row">
                                <div class="col-3 ">사진등록/교체</div>
                                <div class="col-9">
                                    <!-- 사진 등록 -->
                                    <div class="input-group">
                                        <input class="form-control" type="file" id="formFile">
                                        <button class="btn btn-outline-danger" type="button" id="deleteFileBtn" style="display: none;">삭제</button>
                                    </div>
                                    <!--// 사진 등록 -->
                                    <!-- 미리보기 이미지 -->
                                    <div class="d-flex justify-content-center">
                                        <img id="previewImage" src="" alt="미리보기" class="img-fluid rounded border  d-none mt-2" style="max-height: 448px; object-fit: cover;">
                                        <div id="uploadLoading" class="d-none mt-3">
                                            <div class="spinner-border spinner-border-sm me-1"></div>업로드 중입니다...
                                        </div>
                                    </div>
                                    <!-- 파일명 -->
                                    <div id="fileNameDisplay" class="text-muted mt-1"></div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-3 ">사진등록/교체</div>
                                <div class="col-9">
                                    <!-- 사진 등록 -->
                                    <div class="input-group">
                                        <input class="form-control" type="file" id="formFile1">
                                        <button class="btn btn-outline-danger" type="button" id="deleteFileBtn1" style="display: none;">삭제</button>
                                    </div>
                                    <!--// 사진 등록 -->
                                    <!-- 미리보기 이미지 -->
                                    <div class="d-flex justify-content-center">
                                        <img id="previewImage1" src="" alt="미리보기" class="img-fluid rounded border  d-none mt-2" style="max-height: 448px; object-fit: cover;">
                                        <div id="uploadLoading1" class="d-none mt-3">
                                            <div class="spinner-border spinner-border-sm me-1"></div>업로드 중입니다...
                                        </div>
                                    </div>
                                    <!-- 파일명 -->
                                    <div id="fileNameDisplay1" class="text-muted mt-1"></div>
                                </div>
                            </div>
                            <!---->
                            <hr>
                            <div class="row">
                                <div class="col-3 ">권한</div>
                                <div class="col-9">
                                    <input type="checkbox" class="form-check-input" id="level" name="level">
                                    <label class="form-check-label ms-1" for="level">권한 없음</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!--// modal-body -->

                    <!-- modal-footer -->
                    <div class="modal-footer p-2">
                        <button type="button" class="btn btn-light me-1" id="user-cancel-btn" data-bs-dismiss="modal">취소</button>
                        <button type="button" class="btn btn-primary" id="user-confirm">확인</button>
                    </div>
                    <!--// modal-footer -->
                </div>
            </div>
        </div><!--// 사용자추가 모달 -->
    </th:block>

    <!-- script block -->
    <th:block th:fragment="pageScript">

        <!-- Daterangepicker Plugin js / 날짜 범위 선택 -->
        <script src="/vendor/daterangepicker/moment.min.js"></script>
        <script src="/vendor/daterangepicker/daterangepicker.js"></script>

        <!-- Dropzone File Upload js / 데이타 업로드 -->
        <script src="/vendor/dropzone/min/dropzone.min.js"></script>
        <!-- File Upload Demo js -->
        <script src="/js/pages/component.fileupload.js"></script>

        <!-- custom -->
        <script type="module" src="/js/management/manage-staff.js"></script>

    </th:block>

</th:block>
