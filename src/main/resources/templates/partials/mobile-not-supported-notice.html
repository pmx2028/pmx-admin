<th:block th:fragment="mobile-not-supported-notice(noticeId)">
    <div class="row d-none management-mobile-notice" th:id="${noticeId}">
        <div class="col-12">
            <div class="card">
                <div class="card-body text-center py-5">
                    모바일 환경에서는 지원하지 않는 기능입니다.<br>
                    PC 환경에서 이용해 주세요.
                </div>
            </div>
        </div>
    </div>
</th:block>
