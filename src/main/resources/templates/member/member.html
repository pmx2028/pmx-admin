<!--
  페이지 생성시 해당 페이지 구조 복붙해서 사용하면됩니다.
-->
<!DOCTYPE html>
<th:block th:replace="~{layout/base-layout :: base-layout(
            pageContent=~{::pageContent},
            pageHead=~{::pageHead},
            pageModal=~{::pageModal},
            pageScript=~{::pageScript},
            title='회원관리',
            subtitle='관리'
        )}">

    <!-- head block -->
    <th:block th:fragment="pageHead">
        <!-- 여기에 추가적으로 필요한 head 내용을 넣습니다. -->
        <!-- Daterangepicker css -->
        <link href="/vendor/daterangepicker/daterangepicker.css" rel="stylesheet" type="text/css" />
        <!-- Datatables css -->
        <link href="/vendor/datatables.net-bs5/css/dataTables.bootstrap5.min.css" rel="stylesheet" type="text/css" />
        <link href="/vendor/datatables.net-responsive-bs5/css/responsive.bootstrap5.min.css" rel="stylesheet" type="text/css" />

        <!-- custom css  -->
        <link href="/css/management.css" rel="stylesheet" type="text/css" />
    </th:block>

    <!-- content block -->
    <th:block th:fragment="pageContent">
        <th:block th:replace="~{partials/mobile-not-supported-notice :: mobile-not-supported-notice('member-mobile-notice')}"></th:block>
        <!-- 여기에 페이지 본문 내용을 넣습니다. -->
        <!-- row -->
        <div class="row management-mobile-notice-target">

            <!-- col-->
            <div class="col-12 mobile-p0 m-0">
                <!-- card -->
                <div class="card">
                    <!-- card body-->
                    <div class="card-body p-2">
                        <form>
                            <!-- top -->
                            <div class="manage-data manage-bottom">
                                <div class="row g-2">
                                    <!-- 버튼 -->
                                    <div class="col-12 col-md-auto">
                                        <button type="button" class="btn btn-primary management-btn mb-2" data-bs-toggle="modal" data-bs-target="#user-modal">
                                            <i class="ri-add-circle-line me-1"></i> 회원 등록
                                        </button>
                                    </div><!--//버튼 -->

                                    <!-- 검색영역 -->
                                    <div class="col-12 col-md">
                                        <div class="row g-2 justify-content-md-end">

                                            <!-- 지역/시군구/아파트 검색영역 (공통 fragment) -->
                                            <th:block th:replace="~{partials/search-apart-filters :: search-apart-filters}"></th:block>
                                            <!-- 검색 -->
                                            <div class="col-12 col-sm-8 col-lg-6 col-xl-4 mb-2">
                                                <div class="input-group">
                                                    <input type="text" id="target-text" class="form-control w-33"
                                                           placeholder="이름 검색">
                                                    <button type="button" class="btn btn-primary border-primary" id="btn-search">
                                                        <i class="ri-search-line me-1"></i> 검색
                                                    </button>
                                                    <button type="button" class="btn btn-soft-dark shadow-none ms-1" id="btn-reset">
                                                        <i class="ri-loop-left-fill me-1"></i> <span>초기화</span>
                                                    </button>
                                                </div>
                                            </div><!--// 검색 -->
                                        </div><!--//row -->
                                    </div><!--// 검색영역 -->
                                </div><!--//row -->
                            </div><!--//top -->

                            <!-- table #dataTable - DataTable 로드 -->
                            <div class="scrollable-container" data-simplebar data-simplebar-auto-hide="false">
                                <div class="table-inner-wrapper">
                                    <table id="memberDataTable" class="table table-striped table-hover w-100 custom org-custom text-center">
                                    </table>
                                </div>
                            </div><!--//table -->
                            <!-- 푸터 페이지네이션 -->
                            <div class="dt-footer" data-table="memberDataTable"></div>
                        </form>
                    </div><!--// card body-->
                </div> <!--// card -->
            </div><!--//col-->


        </div><!--//row -->
    </th:block>

    <!-- modal block -->
    <th:block th:fragment="pageModal">

        <!-- 회원 등록/수정 모달 -->
        <div class="modal fade" id="user-modal" tabindex="-1" aria-labelledby="user-modal" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <!-- modal-header -->
                    <div class="modal-header justify-content-end bg-primary text-white">
                        <h5 class="modal-title">
                            <i class="ri-user-add-fill me-1"></i>
                            <span id="user-modal-title">회원 등록</span>
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <!--// modal-header -->

                    <!-- modal-body -->
                    <div class="p-1">
                        <div class="modal-body px-2 pb-3">
                            <!---->
                            <div class="row mb-2">
                                <div class="col-3 ">아이디</div>
                                <div class="col-9">
                                    <input type="text" class="form-control" id="login" placeholder="아이디를 입력해 주세요">
                                </div>
                            </div>
                            <!---->
                            <div class="row mb-2">
                                <div class="col-3 ">비밀번호</div>
                                <div class="col-9">
                                    <input type="password" class="form-control" id="password" placeholder="비밀번호를 입력해 주세요">
                                </div>
                            </div>
                            <!---->
                            <div class="row mb-2">
                                <div class="col-3 ">비밀번호 확인</div>
                                <div class="col-9">
                                    <input type="password" class="form-control" id="pw-check" placeholder="비밀번호를 다시 입력해 주세요">
                                </div>
                            </div>
                            <!---->
                            <div class="row">
                                <div class="col-3 ">이름</div>
                                <div class="col-9">
                                    <input type="text" class="form-control mb-2" id="name" placeholder="이름을 입력해 주세요">
                                </div>
                            </div>
                            <!---->
                            <div class="row">
                                <div class="col-3 ">이메일</div>
                                <div class="col-9">
                                    <input type="text" class="form-control mb-2" id="email" placeholder="이메일을 입력해 주세요">
                                </div>
                            </div>
                            <!---->
                            <div class="row">
                                <div class="col-3 ">휴대폰</div>
                                <div class="col-9">
                                    <input type="text" class="form-control mb-2" id="mobile" placeholder="휴대폰 번호를 입력해 주세요">
                                </div>
                            </div>
                            <!-- 지역/시군구/아파트 선택영역 (공통 fragment) -->
                            <th:block th:replace="~{partials/search-apart-filters :: search-apart-filters-form('member-modal-depth1', 'member-modal-depth2', 'apartId')}"></th:block>
                            <div class="row">
                                <div class="col-3 ">상세주소(동/호)</div>
                                <div class="col-9">
                                    <input type="text" class="form-control mb-2" id="address" placeholder="주소를 입력해 주세요">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-3 ">우편번호</div>
                                <div class="col-9">
                                    <input type="text" class="form-control mb-2" id="zipcode" placeholder="우편번호를 입력해 주세요">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-3 ">성별</div>
                                <div class="col-9 mb-2">
                                    <div class="d-flex align-items-center gap-3">
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="sex" id="sex-male" value="M">
                                            <label class="form-check-label" for="sex-male">남성</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="sex" id="sex-female" value="F">
                                            <label class="form-check-label" for="sex-female">여성</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-3 ">생년월일</div>
                                <div class="col-9">
                                    <input type="text" class="form-control mb-2" id="birthday" placeholder="생년월일을 입력해 주세요">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-3 ">상태</div>
                                <div class="col-9 mb-2">
                                    <div class="d-flex align-items-center gap-3">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="confirmed" value="1">
                                            <label class="form-check-label" for="confirmed">승인</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="activated" value="1" checked>
                                            <label class="form-check-label" for="activated">활성</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-text" id="user-form-message"></div>
                        </div>
                    </div>
                    <!--// modal-body -->

                    <!-- modal-footer -->
                    <div class="modal-footer p-2">
                        <button type="button" class="btn btn-light me-1" id="user-cancel-btn" data-bs-dismiss="modal">취소</button>
                        <button type="button" class="btn btn-primary" id="user-confirm">등록</button>
                    </div>
                    <!--// modal-footer -->
                </div>
            </div>
        </div><!--// 회원 등록/수정 모달 -->

        <!-- 회원 해지 확인 모달 -->
        <div class="modal fade" id="resign-modal" tabindex="-1" aria-labelledby="resign-modal" aria-hidden="true">
            <div class="modal-dialog modal-sm">
                <div class="modal-content">
                    <div class="modal-header justify-content-end bg-danger text-white">
                        <h5 class="modal-title">
                            <i class="ri-user-unfollow-fill me-1"></i>
                            회원 해지
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        해당 회원을 해지 처리하시겠습니까?
                    </div>
                    <div class="modal-footer p-2">
                        <button type="button" class="btn btn-light me-1" data-bs-dismiss="modal">취소</button>
                        <button type="button" class="btn btn-danger" id="resign-confirm">해지</button>
                    </div>
                </div>
            </div>
        </div><!--// 회원 해지 확인 모달 -->
    </th:block>

    <!-- script block -->
    <th:block th:fragment="pageScript">

        <!-- Daterangepicker Plugin js / 날짜 범위 선택 -->
        <script src="/vendor/daterangepicker/moment.min.js"></script>
        <script src="/vendor/daterangepicker/daterangepicker.js"></script>

        <!-- custom -->
        <script type="module" src="/js/member/member.js"></script>

    </th:block>

</th:block>
