spring:
  application:
    name: paramount-pmx
    siteurl: "http://localhost:7022"

  messages:
    cache-duration: 3600
    basename: "classpath:locale/messages"
    encoding: "UTF-8"

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 30MB

  datasource:
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    tomcat:
      connection-properties: "useUnicode=true;characterEncoding=utf-8"

  jmx:
    enabled: true

  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      jakarta:
        persistence:
          query:
            timeout: 10000
  data:
    redis:
      host: localhost
      port: 6379
      password: ""

  session:
    store-type: redis # 레디스를 타겟팅하도록 명시!
    timeout: 1h   # 실제 사용 하단 servlet timeout 도 동일하게 세팅
    redis:
      repository-type: indexed
      flush-mode: immediate
      namespace: "myapp_pmx:sess"
      cleanup-cron: "0 0 */1 * * *"

  thymeleaf:
    enabled: true
    prefix: "classpath:/templates/"
    suffix: ".html"
    mode: HTML
    encoding: "UTF-8"
    cache: false
    servlet:
      content-type: "text/html"

  output:
    ansi:
      enabled: always

