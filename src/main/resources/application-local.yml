#            enable: true
#          auth: true
#          socketFactory:
#            class: javax.net.ssl.SSLSocketFactory
#        smtps:
#          ssl:
#            checkserveridentity: true
#          ssl.trust: "*"
  task:
    scheduling:
      thread:
        pool:
          # 스케줄링 태스크를 실행할 스레드 풀의 크기
          size: 5

server:
  port: 7022
  compression:
    enabled: true
  tomcat:
    mbeanregistry:
      enabled: true

  error:
    include-exception: true
    include-stacktrace: ALWAYS
    path: /error
    whitelabel:
      enabled: false

  servlet:
    context-path: /
    session:
      timeout: 1h
      cookie:
        path: /
        name: JSESSIONID_PMX
        http-only: true
        secure: false
        same-site: lax

logging:
  config: "classpath:logback-spring.xml"
  file:
    path: logs
  level:
    p6spy: INFO
    root: INFO
    # RequestLoggingFilter 로그
    com.paramount.pmx.logging.RequestLoggingFilter: INFO
    org:
      springframework: INFO
      springframework.web: INFO
      springframework.web.servlet.DispatcherServlet: DEBUG
      springframework.web.servlet.handler.SimpleUrlHandlerMapping: WARN
      springframework.web.servlet.resource: WARN
      springframework.web.servlet.mvc.method.annotation: INFO
      hibernate:
        SQL: OFF
        type:
          descriptor:
            sql:
              BasicBinder: OFF
        orm:
          jdbc:
            bind: OFF
        engine:
          internal:
            StatisticalLoggingSessionEventListener: OFF
      thymeleaf: INFO
      thymeleaf.standard: INFO
      thymeleaf.inline: INFO

cloud:
  aws:
    credentials:
      accessKey: ${AWS_ACCESS_KEY}
      secretKey: ${AWS_SECRET_KEY}
    stack:
      auto: false
    region:
      static: ap-northeast-2
    s3:
      bucket: pmx2028-dev-bucket
      url: "https://s3.ap-northeast-2.amazonaws.com/pmx2028-dev-bucket"


paramount:
  security:
    rememberme-enabled: false
    rememberme-cookiename: RSESSIONID_PMX_DC
    rememberme-key: ${REMEMBER_ME_KEY}
    rememberme-table: persistent_logins_pmx
    rememberme-validity-days: 7
